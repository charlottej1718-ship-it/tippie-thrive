<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tippie Thrive: Where Does Time Go?</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --tippie-gold: #FFCD00;
            --tippie-black: #000000;
            --dark-gray: #1e1e1e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tippie-black);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--dark-gray);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            color: var(--tippie-gold);
            font-size: 24px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 14px;
            text-align: center;
            color: #aaaaaa;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .chart-box {
            position: relative;
            margin: 0 auto 25px auto;
            height: 220px;
            width: 220px;
        }
        .slider-group {
            margin-bottom: 18px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: #333;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--tippie-gold);
            cursor: pointer;
        }
        .status-box {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .normal { background: #1b4332; color: #75e6da; }
        .over { background: #641e16; color: #f1948a; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tippie Thrive</h1>
    <h2>Daily Time Budget Auditing Tool</h2>
    
    <div class="chart-box">
        <canvas id="timeChart"></canvas>
    </div>

    <div id="slidersContainer"></div>
    <div id="status" class="status-box"></div>
</div>

<script>
    const categories = [
        { id: 'sleep', name: '🛏️ Sleep', val: 8, color: '#36A2EB' },
        { id: 'class', name: '🏫 Classes & Commute', val: 4, color: '#FFCE56' },
        { id: 'study', name: '📚 Studying & Homework', val: 4, color: '#4BC0C0' },
        { id: 'work', name: '💼 Job & Student Orgs', val: 2, color: '#9966FF' },
        { id: 'meals', name: '🍕 Meals & Self-Care', val: 2, color: '#FF9F40' }
    ];

    const container = document.getElementById('slidersContainer');
    categories.forEach(cat => {
        container.innerHTML += `
            <div class="slider-group">
                <div class="slider-label">
                    <span>${cat.name}</span>
                    <span id="${cat.id}-val">${cat.val} hrs</span>
                </div>
                <input type="range" id="${cat.id}" min="0" max="24" step="0.5" value="${cat.val}" oninput="updateTime()">
            </div>
        `;
    });

    const ctx = document.getElementById('timeChart').getContext('2d');
    let timeChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: [...categories.map(c => c.name.split(' ')[1]), 'Free Time'],
            datasets: [{
                data: [...categories.map(c => c.val), 4],
                backgroundColor: [...categories.map(c => c.color), '#2ecc71'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
        }
    });

    function updateTime() {
        let totalUsed = 0;
        categories.forEach((cat, index) => {
            const val = parseFloat(document.getElementById(cat.id).value);
            document.getElementById(`${cat.id}-val`).innerText = val + ' hrs';
            timeChart.data.datasets[0].data[index] = val;
            totalUsed += val;
        });

        const remaining = 24 - totalUsed;
        const statusEl = document.getElementById('status');

        if (remaining >= 0) {
            timeChart.data.datasets[0].data[categories.length] = remaining;
            timeChart.data.datasets[0].backgroundColor[categories.length] = '#2ecc71';
            statusEl.innerText = `🎉 Remaining Free Time: ${remaining} hours`;
            statusEl.className = "status-box normal";
        } else {
            timeChart.data.datasets[0].data[categories.length] = 0;
            statusEl.innerText = `⚠️ Over Budget by ${Math.abs(remaining)} hours! (Total: ${totalUsed}/24)`;
            statusEl.className = "status-box over";
        }
        timeChart.update();
    }
    updateTime();
</script>

</body>
</html>
