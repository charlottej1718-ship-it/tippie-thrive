<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tippie Thrive: Where Does Time Go?</title>
    <style>
        :root {
            --tippie-gold: #FFCD00;
            --tippie-black: #000000;
            --light-gray: #f4f4f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: var(--tippie-black);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--light-gray);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 {
            color: var(--tippie-black);
            font-size: 24px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 800;
        }
        h2 {
            font-size: 14px;
            text-align: center;
            color: #555555;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .chart-box {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: background 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .slider-group {
            margin-bottom: 18px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .label-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: #dddddd;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .status-box {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .normal { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .over { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tippie Thrive</h1>
    <h2>Daily Time Budget Auditing Tool</h2>
    
    <div class="chart-box">
        <div id="pieChart" class="pie-chart"></div>
    </div>

    <div id="slidersContainer"></div>
    <div id="status" class="status-box"></div>
</div>

<script>
    const categories = [
        { id: 'sleep', name: '🛏️ Sleep', color: '#36A2EB' },
        { id: 'class', name: '🏫 Classes', color: '#FFCE56' },
        { id: 'study', name: '📚 Studying & Homework', color: '#4BC0C0' },
        { id: 'work', name: '💼 Job', color: '#9966FF' },
        { id: 'studentorgs', name: '📣 Student Orgs & Clubs', color: '#9B59B6' },
        { id: 'commute', name: '🚗 Commute (walking and driving)', color: '#E74C3C' },
        { id: 'ready', name: '🚿 Getting Ready (getting ready for the day)', color: '#F1948A' },
        { id: 'meals', name: '🍕 Meals & Nutrition', color: '#FF9F40' },
        { id: 'social', name: '👥 Socializing', color: '#34495E' },
        { id: 'downtime', name: '📱 Downtime (TV or phone scrolling)', color: '#1ABC9C' },
        { id: 'misc', name: '⚙️ Miscellaneous / Other', color: '#7F8C8D' }
    ];

    const container = document.getElementById('slidersContainer');
    categories.forEach(cat => {
        container.innerHTML += '<div class="slider-group"><div class="slider-label"><span class="label-text"><span class="color-dot" style="background-color: ' + cat.color + ';"></span>' + cat.name + '</span><span id="' + cat.id + '-val">0 hrs</span></div><input type="range" id="' + cat.id + '" min="0" max="24" step="0.5" value="0" oninput="updateTime()"></div>';
        
        const style = document.createElement('style');
        style.innerHTML = '#' + cat.id + '::-webkit-slider-thumb { background: ' + cat.color + ' !important; } #' + cat.id + '::-moz-range-thumb { background: ' + cat.color + ' !important; }';
        document.head.appendChild(style);
    });

    function updateTime() {
        let totalUsed = 0;
        let slices = [];
        let currentAngle = 0;

        categories.forEach(cat => {
            const val = parseFloat(document.getElementById(cat.id).value);
            document.getElementById(cat.id + '-val').innerText = val + ' hrs';
            totalUsed += val;

            if (val > 0) {
                const nextAngle = currentAngle + (val / 24) * 360;
                slices.push(cat.color + ' ' + currentAngle + 'deg ' + nextAngle + 'deg');
                currentAngle = nextAngle;
            }
        });

        const remaining = 24 - totalUsed;
        const statusEl = document.getElementById('status');
        const pieEl = document.getElementById('pieChart');

        if (remaining >= 0) {
            if (remaining > 0) {
                slices.push('#2ecc71 ' + currentAngle + 'deg 360deg');
            }
            statusEl.innerText = '🎉 Remaining Free Time: ' + remaining + ' hours';
            statusEl.className = "status-box normal";
        } else {
            statusEl.innerText = '⚠️ Over Budget by ' + Math.abs(remaining) + ' hours! (Total: ' + totalUsed + '/24)';
            statusEl.className = "status-box over";
        }

        if (slices.length > 0) {
            pieEl.style.background = 'conic-gradient(' + slices.join(', ') + ')';
        } else {
            pieEl.style.background = '#e0e0e0';
        }
    }
    updateTime();
</script>

</body>
</html>
